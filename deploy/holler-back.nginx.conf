# Reference nginx vhost for Holler Back.
# Copy to /etc/nginx/sites-available/chat.example.com and edit server_name +
# cert paths, then symlink into sites-enabled and reload.
#
# Requires:
#   - PHP-FPM socket (adjust `fastcgi_pass` to match your distro)
#   - ws-server.php running under systemd (see deploy/holler-back.service)

# WebSocket connection-upgrade helper (nginx-standard).
# If your box already defines this in another vhost, delete this map.
map $http_upgrade $hb_connection_upgrade {
    default upgrade;
    ''      close;
}

# Loopback upstream for the WS process (ws_bind:ws_port in config.php).
upstream hb_ws {
    server 127.0.0.1:8090;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;
    # Let certbot / your ACME client answer challenges here, then 301 to https.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/holler-back/public;
    index index.php;

    # Never serve the admin console from a cache
    add_header Cache-Control "no-store" always;

    # Widget JS — cache-friendly (immutable in practice, no build hash yet so short TTL)
    location = /widget.js {
        add_header Cache-Control "public, max-age=300" always;
        try_files /widget.js =404;
    }

    # PWA manifest + service worker — short cache, browser handles updates
    location = /manifest.json { try_files /manifest.json =404; }
    # The console script: revalidate every load, or phones keep running an old copy.
    location = /admin.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /admin.js =404;
    }
    location = /sw.js         { add_header Cache-Control "no-store" always; try_files /sw.js =404; }

    # WebSocket routes. No trailing slash on proxy_pass: ws-server routes on the
    # full /ws/... path, and a slash would also expose /_internal/publish.
    location /ws/ {
        proxy_pass http://hb_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hb_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API front-controller
    location /api/ {
        try_files $uri /api.php$is_args$args;
    }

    # Admin console. admin/ sits beside public/, not inside it, so it gets its
    # own root. Consider allow/deny here (VPN-only) — see install.md step 7.
    location = /admin/inc.php { return 404; }
    location ^~ /admin/ {
        root /var/www/holler-back;
        index index.php;
        try_files $uri $uri/ /admin/index.php$is_args$args;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    # Front-controller PHP
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Deny access to internals just in case
    location ~ /(config\.php|data/|lib/|worker/|ws-server\.php)(/|$) { deny all; return 404; }
}
