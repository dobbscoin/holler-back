; Holler Back — its own PHP user, so other sites on the same server
; cannot read its config or DB (cookie_secret forges admin logins).
[holler-back]
user = hollerback
group = hollerback
listen = /run/php/php8.3-fpm-holler-back.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500
php_admin_value[open_basedir] = /var/www/holler-back/:/tmp/
php_admin_flag[allow_url_fopen] = off
php_admin_value[upload_max_filesize] = 64K
php_admin_value[post_max_size] = 64K
